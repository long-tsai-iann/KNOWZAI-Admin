name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm test
      # 建置不需要真的後端網址也能過（NEXT_PUBLIC_API_BASE_URL 沒設定時
      # lib/api.js 會退回 http://localhost:3002，只影響執行期行為，不影響
      # build 本身能不能過）。
      - run: npm run build

  secrets:
    # 跟主專案同一套：.env / 金鑰不進 repo（.gitleaks.toml）。
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 不用 gitleaks-action：它對「組織」底下的 repo 要收費授權（管理後台 repo 就撞到），
      # 直接跑開源 CLI 一樣的結果、免授權，也跟 pre-commit 用的是同一個指令。
      - name: Run gitleaks
        run: |
          set -e
          VER=8.30.1
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1 --verbose
